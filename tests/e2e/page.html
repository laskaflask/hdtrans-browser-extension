<!doctype html>
<html lang="ja">
<head><meta charset="utf-8"><title>hdTrans E2E</title></head>
<body>
<!-- One case per element; run.mjs reads them back by id. -->
<p id="inline">ユキさんは<b>魔導具</b>を使った。</p>
<p id="link">詳しくは<a href="#">こちら</a>をご覧ください。</p>
<p id="ruby">ユキさんは<ruby>弄<rt>もてあそ</rt></ruby>ぶように<b>魔導具</b>を使った。</p>
<p id="letters">これは、<span>そ</span><span>う</span><span>い</span><span>う</span><span>ス</span><span>ト</span><span>ー</span><span>リ</span><span>ー</span>なのだ。</p>
<p id="dict">東京の空は青い。</p>
<p id="mark">区切り‖記号を含む文です。</p>
<img id="img" alt="美しい花" src="data:,">
<code id="code">今日は</code>
<iframe id="frame-same" src="/embed-same.html"></iframe>
<iframe id="frame" src="__FRAME_ORIGIN__/embed.html"></iframe>
<!-- Cross-origin frame opted out: it must stay untranslated even when its origin is allowed. -->
<iframe id="frame-optout" src="__FRAME_ORIGIN__/embed-optout.html" translate="no"></iframe>
<!-- Frame whose own document opts out: its page script must refuse to translate it. -->
<iframe id="frame-docoptout" src="__FRAME_ORIGIN__/embed-docoptout.html"></iframe>
</body>
</html>
